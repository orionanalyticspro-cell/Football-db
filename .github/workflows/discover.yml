name: Découvrir les ligues ESPN disponibles

on:
  schedule:
    - cron: "0 3 * * 1"      # chaque lundi : détecte les ligues qui entrent en saison
  workflow_dispatch:
    inputs:
      args:
        description: "Options (ex. --slugs sau.1,civ.1,mar.1 --days 45). Vide = toutes les ligues."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: football-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test des ligues
        timeout-minutes: 15            # si ça dépasse, l'étape s'arrête mais le rapport partiel est quand même publié
        run: npm run discover -- ${{ github.event.inputs.args }}
        env:
          SCRAPER_UA: "football-db/0.1 (+${{ github.server_url }}/${{ github.repository }})"
          REQUEST_DELAY_MS: "300"
          REQUEST_TIMEOUT_MS: "15000"
      - name: Publication du rapport
        if: always()
        run: |
          git config user.name  "football-db-bot"
          git config user.email "football-db-bot@users.noreply.github.com"
          git add data/discovered.md data/discovered.json config/sources.auto.json || true
          git diff --cached --quiet || git commit -m "rapport: ligues ESPN disponibles"
          git pull --rebase --autostash
          git push
